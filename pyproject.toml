[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autosartool"
version = "0.1.0"
description = "Open Adaptive AUTOSAR application component & Basic Software module configuration tool"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "autosartool contributors" }]
keywords = ["autosar", "adaptive", "ara-com", "arxml", "ecu", "automotive", "someip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jamesembeddedsystems02-star/autosartool"

[project.scripts]
autosartool = "autosartool.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
